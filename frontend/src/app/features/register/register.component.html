<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <img src="assets/logo.png" alt="JAXINDUSTRIES Logo" class="brand-logo">
      <h1 class="brand-title">Crear Cuenta</h1>
      <p class="brand-subtitle">JAXINDUSTRIES - Gestión de Gastos</p>
    </div>

    <div *ngIf="errorMessage" class="alert error-alert">
      <span>⚠️ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="Tu nombre de usuario">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
        <label class="hint-text">La contraseña debe tener al menos 6 caracteres.</label>
      </div>

      <div class="form-group">
        <label>Género</label>
        <div class="gender-selector">
          <label class="radio-label">
            <input type="radio" formControlName="gender" value="male"> Hombre
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="gender" value="female"> Mujer
          </label>
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="btn-primary">
        {{ isLoading ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>

    <div class="footer-links">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
